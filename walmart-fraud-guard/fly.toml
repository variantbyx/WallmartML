app = "walmart-fraud-guard"
primary_region = "us-sea"

[build]
  dockerfile = "walmart-fraud-guard/backend/Dockerfile"
  cmd = ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  PYTHONUNBUFFERED = "1"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpus = 1
